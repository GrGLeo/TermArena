# Rate Limiter Configuration
# Token bucket algorithm settings for different request types
# refill rate is tokens per second (scaled by 1000 internally)

register_request:
  capacity: 2
  refill: 33
login_challenge_request:
  capacity: 2
  refill: 33
find-room:
  capacity: 30
  refill: 500
message_request:
  capacity: 30
  refill: 500
